name: Update EPG

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge SK, CZ, HU EPG
        run: |
          python3 -c '
          import gzip
          import urllib.request
          import xml.etree.ElementTree as ET

          urls = [
              "https://epgshare01.online/epgshare01/epg_ripper_SK1.xml.gz",
              "https://epgshare01.online/epgshare01/epg_ripper_CZ1.xml.gz",
              "https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz",
          ]

          root = ET.Element("tv")
          seen = set()

          for url in urls:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              raw = gzip.decompress(urllib.request.urlopen(req, timeout=60).read())
              tree = ET.fromstring(raw)

              for channel in tree.findall("channel"):
                  cid = channel.attrib.get("id")
                  if cid and cid not in seen:
                      seen.add(cid)
                      root.append(channel)

              for programme in tree.findall("programme"):
                  root.append(programme)

          with gzip.open("epg.xml.gz", "wb") as f:
              f.write(ET.tostring(root, encoding="utf-8", xml_declaration=True))
          '

      - name: Commit and push merged EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz
          git commit -m "Update EPG" || exit 0
          git push
